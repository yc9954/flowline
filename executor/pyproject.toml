[project]
name = "executor"
version = "0.1.0"
description = "Flowline executor: Claude computer-use runs on Mac and Linux desktops, actor, observer, compiler, measurement"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=0.50",
  "pydantic>=2",
  "pillow>=10",
  "odfpy>=1.4",
  "pandas>=2.2",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pynacl>=1.5",
  "httpx>=0.27",
  "pytest>=8",
  "reportlab>=5.1.0",
  "pypdf>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
