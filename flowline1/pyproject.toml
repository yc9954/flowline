[project]
name = "flowline1"
version = "0.1.0"
description = "Flowline-1: process miner, team simulator, calibration, demand model, BPIC 2020 fit"
requires-python = ">=3.12"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lxml>=5.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowline1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
